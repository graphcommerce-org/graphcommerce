tasks:
  - before: nvm install 24
    init: |
      cd examples/magento-graphcms
      yarn
      yarn codegen
    command: cd /workspace/graphcommerce/examples/magento-graphcms && npm run dev
vscode:
  extensions:
    - oxc.oxc-vscode
    - GraphQL.vscode-graphql
    - mikestead.DotENV
    - mrorz.language-gettext
    - redhat.vscode-yaml
